<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Asset Tracker — ระบบทะเบียนอุปกรณ์ไอที</title>
<style>
  body {
    font-family: "Segoe UI", "Tahoma", sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 24px;
    background: #f5f6f8;
    color: #1f2328;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 24px;
  }

  h2 {
    font-size: 16px;
    margin: 0 0 16px;
  }

  section {
    background: #fff;
    border: 1px solid #d8dbe0;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 20px;
  }

  /* ฟอร์มจัดเป็นสองคอลัมน์ ป้ายชื่อซ้าย ช่องกรอกขวา */
  .field {
    display: grid;
    grid-template-columns: 140px 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  label {
    font-size: 14px;
  }

  input,
  select {
    font-family: inherit;
    font-size: 14px;
    padding: 7px 9px;
    border: 1px solid #c4c8ce;
    border-radius: 4px;
    background: #fff;
  }

  input:focus,
  select:focus {
    outline: 2px solid #4a7dbd;
    outline-offset: -1px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 20px;
    border: none;
    border-radius: 4px;
    background: #2f6fb0;
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: #275e97;
  }

  .form-actions {
    margin-left: 152px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th,
  td {
    text-align: left;
    padding: 9px 10px;
    border-bottom: 1px solid #e4e6ea;
  }

  th {
    background: #f0f2f5;
    font-weight: 600;
  }

  #empty-message {
    color: #6a7178;
    font-size: 14px;
    margin: 0;
  }

  /* แถบค้นหาและตัวกรอง วางเหนือตาราง */
  .filters {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .filters input[type="search"] {
    flex: 1;
  }

  #result-count {
    color: #6a7178;
    font-size: 13px;
    margin: 0 0 12px;
  }

  /* ปุ่มในแถวตาราง ทำให้เล็กกว่าปุ่มบันทึกของฟอร์ม */
  .row-actions button {
    font-size: 13px;
    padding: 4px 12px;
  }

  .row-actions button + button {
    margin-left: 6px;
  }

  .delete-button {
    background: #b3261e;
  }

  .delete-button:hover {
    background: #96201a;
  }

  #cancel-edit {
    background: #6a7178;
    margin-left: 8px;
  }

  #cancel-edit:hover {
    background: #585e64;
  }

  .table-actions {
    margin-bottom: 12px;
  }

  #export-csv {
    font-size: 13px;
    padding: 4px 12px;
  }
</style>
</head>
<body>

<h1>IT Asset Tracker — ระบบทะเบียนอุปกรณ์ไอที</h1>

<section>
  <h2 id="form-title">เพิ่มอุปกรณ์</h2>
  <form id="asset-form">
    <div class="field">
      <label for="name">ชื่ออุปกรณ์</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="category">ประเภท</label>
      <select id="category" required>
        <option value="notebook">โน้ตบุ๊ก</option>
        <option value="monitor">จอ</option>
        <option value="printer">เครื่องพิมพ์</option>
        <option value="switch">สวิตช์</option>
        <option value="camera">กล้องวงจรปิด</option>
      </select>
    </div>
    <div class="field">
      <label for="serial_number">หมายเลขเครื่อง</label>
      <input type="text" id="serial_number" required>
    </div>
    <div class="field">
      <label for="holder_name">ผู้ถือครอง</label>
      <input type="text" id="holder_name">
    </div>
    <div class="field">
      <label for="status">สถานะ</label>
      <select id="status" required>
        <option value="available">ว่าง</option>
        <option value="in_use">ใช้งาน</option>
        <option value="repair">ซ่อม</option>
        <option value="disposed">จำหน่ายออก</option>
        <option value="lost">สูญหาย</option>
      </select>
    </div>
    <div class="field">
      <label for="note">หมายเหตุ</label>
      <input type="text" id="note">
    </div>
    <div class="form-actions">
      <button type="submit" id="submit-button">เพิ่มอุปกรณ์</button>
      <button type="button" id="cancel-edit" hidden>ยกเลิก</button>
    </div>
  </form>
</section>

<section>
  <h2>รายการอุปกรณ์</h2>
  <div class="filters">
    <input type="search" id="search" placeholder="ค้นหาชื่ออุปกรณ์ หมายเลขเครื่อง หรือผู้ถือครอง">
    <select id="filter-category">
      <option value="">ทุกประเภท</option>
      <option value="notebook">โน้ตบุ๊ก</option>
      <option value="monitor">จอ</option>
      <option value="printer">เครื่องพิมพ์</option>
      <option value="switch">สวิตช์</option>
      <option value="camera">กล้องวงจรปิด</option>
    </select>
    <select id="filter-status">
      <option value="">ทุกสถานะ</option>
      <option value="available">ว่าง</option>
      <option value="in_use">ใช้งาน</option>
      <option value="repair">ซ่อม</option>
      <option value="disposed">จำหน่ายออก</option>
      <option value="lost">สูญหาย</option>
    </select>
  </div>
  <p id="result-count"></p>
  <div class="table-actions">
    <button type="button" id="export-csv">ส่งออก CSV</button>
  </div>
  <p id="empty-message">ยังไม่มีอุปกรณ์ในระบบ</p>
  <table id="asset-table">
    <thead>
      <tr>
        <th>#</th>
        <th>ชื่ออุปกรณ์</th>
        <th>ประเภท</th>
        <th>หมายเลขเครื่อง</th>
        <th>ผู้ถือครอง</th>
        <th>สถานะ</th>
        <th>หมายเหตุ</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
  const STORAGE_KEY = 'it_asset_tracker_assets';

  // แปลงค่า enum ที่เก็บในข้อมูลเป็นข้อความไทยตอนแสดงผล
  const CATEGORY_LABELS = {
    notebook: 'โน้ตบุ๊ก',
    monitor: 'จอ',
    printer: 'เครื่องพิมพ์',
    switch: 'สวิตช์',
    camera: 'กล้องวงจรปิด'
  };

  const STATUS_LABELS = {
    in_use: 'ใช้งาน',
    available: 'ว่าง',
    repair: 'ซ่อม',
    disposed: 'จำหน่ายออก',
    lost: 'สูญหาย'
  };

  // id ของรายการที่กำลังแก้ไขอยู่ ค่า null คือฟอร์มอยู่ในโหมดเพิ่ม
  let editingId = null;

  // อ่านรายการอุปกรณ์ทั้งหมดจาก localStorage
  function loadAssets() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return [];
    }
    return JSON.parse(raw);
  }

  // เขียนรายการอุปกรณ์ทั้งหมดทับลง localStorage
  function saveAssets(assets) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(assets));
  }

  // กรองรายการตามคำค้นหา ประเภท และสถานะ ที่ผู้ใช้เลือกอยู่ตอนนี้
  function getFilteredAssets(assets) {
    const keyword = document.getElementById('search').value.trim().toLowerCase();
    const category = document.getElementById('filter-category').value;
    const status = document.getElementById('filter-status').value;

    return assets.filter(function (asset) {
      // ค้นจากชื่ออุปกรณ์ หมายเลขเครื่อง และผู้ถือครอง โดยไม่สนตัวพิมพ์เล็กใหญ่
      const haystack = [asset.name, asset.serial_number, asset.holder_name]
        .join(' ')
        .toLowerCase();

      const matchKeyword = keyword === '' || haystack.includes(keyword);
      const matchCategory = category === '' || asset.category === category;
      const matchStatus = status === '' || asset.status === status;

      return matchKeyword && matchCategory && matchStatus;
    });
  }

  // วาดตารางใหม่จากข้อมูลที่ผ่านการกรองแล้ว
  function renderTable() {
    const assets = loadAssets();
    const visibleAssets = getFilteredAssets(assets);
    const tableBody = document.querySelector('#asset-table tbody');
    const table = document.getElementById('asset-table');
    const emptyMessage = document.getElementById('empty-message');
    const resultCount = document.getElementById('result-count');

    tableBody.textContent = '';

    // ยังไม่มีข้อมูลเลย กับ มีข้อมูลแต่กรองแล้วไม่เจอ เป็นคนละสถานการณ์กัน
    if (assets.length === 0) {
      emptyMessage.textContent = 'ยังไม่มีอุปกรณ์ในระบบ';
    } else {
      emptyMessage.textContent = 'ไม่พบอุปกรณ์ที่ตรงกับเงื่อนไข';
    }

    emptyMessage.hidden = visibleAssets.length > 0;
    table.hidden = visibleAssets.length === 0;
    resultCount.hidden = assets.length === 0;
    resultCount.textContent = 'พบ ' + visibleAssets.length + ' จาก ' + assets.length + ' รายการ';

    visibleAssets.forEach(function (asset, index) {
      const row = document.createElement('tr');
      const values = [
        index + 1,
        asset.name,
        CATEGORY_LABELS[asset.category],
        asset.serial_number,
        asset.holder_name || '—',
        STATUS_LABELS[asset.status],
        asset.note || '—'
      ];

      values.forEach(function (value) {
        const cell = document.createElement('td');
        // ใช้ textContent เพื่อไม่ให้ข้อความที่ผู้ใช้กรอกถูกตีความเป็น HTML
        cell.textContent = value;
        row.appendChild(cell);
      });

      // คอลัมน์จัดการ ผูกปุ่มกับ id ของแถวนี้โดยตรง ไม่พึ่งลำดับแถวที่เปลี่ยนตามตัวกรอง
      const actionCell = document.createElement('td');
      actionCell.className = 'row-actions';

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.textContent = 'แก้ไข';
      editButton.addEventListener('click', function () {
        startEdit(asset.id);
      });

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'delete-button';
      deleteButton.textContent = 'ลบ';
      deleteButton.addEventListener('click', function () {
        deleteAsset(asset.id);
      });

      actionCell.appendChild(editButton);
      actionCell.appendChild(deleteButton);
      row.appendChild(actionCell);

      tableBody.appendChild(row);
    });
  }

  // ดึงค่าของรายการที่เลือกขึ้นฟอร์ม แล้วสลับฟอร์มเป็นโหมดแก้ไข
  function startEdit(id) {
    const asset = loadAssets().find(function (item) {
      return item.id === id;
    });

    document.getElementById('name').value = asset.name;
    document.getElementById('category').value = asset.category;
    document.getElementById('serial_number').value = asset.serial_number;
    document.getElementById('holder_name').value = asset.holder_name || '';
    document.getElementById('status').value = asset.status;
    document.getElementById('note').value = asset.note || '';

    editingId = id;
    document.getElementById('form-title').textContent = 'แก้ไขอุปกรณ์';
    document.getElementById('submit-button').textContent = 'บันทึกการแก้ไข';
    document.getElementById('cancel-edit').hidden = false;
    document.getElementById('name').focus();
  }

  // ออกจากโหมดแก้ไข ล้างฟอร์ม แล้วคืนหน้าตาเป็นโหมดเพิ่ม
  function cancelEdit() {
    editingId = null;
    document.getElementById('asset-form').reset();
    document.getElementById('form-title').textContent = 'เพิ่มอุปกรณ์';
    document.getElementById('submit-button').textContent = 'เพิ่มอุปกรณ์';
    document.getElementById('cancel-edit').hidden = true;
  }

  // ถามยืนยันก่อน แล้วลบรายการนั้นออกถาวร
  function deleteAsset(id) {
    const assets = loadAssets();
    const asset = assets.find(function (item) {
      return item.id === id;
    });

    if (!confirm('ลบ "' + asset.name + '" ออกจากระบบ?')) {
      return;
    }

    // ถ้ากำลังแก้ไขรายการที่กำลังจะถูกลบ ต้องออกจากโหมดแก้ไขก่อน ไม่งั้นฟอร์มจะค้าง
    if (editingId === id) {
      cancelEdit();
    }

    saveAssets(assets.filter(function (item) {
      return item.id !== id;
    }));
    renderTable();
  }

  // รับค่าจากฟอร์ม เพิ่มรายการใหม่หรือเขียนทับรายการเดิม แล้ววาดตารางใหม่
  function handleSubmit(event) {
    event.preventDefault();

    const assets = loadAssets();
    const name = document.getElementById('name').value.trim();
    const category = document.getElementById('category').value;
    const serialNumber = document.getElementById('serial_number').value.trim();
    const holderName = document.getElementById('holder_name').value.trim();
    const status = document.getElementById('status').value;
    const note = document.getElementById('note').value.trim();

    if (editingId === null) {
      assets.push({
        id: crypto.randomUUID(),
        name: name,
        category: category,
        serial_number: serialNumber,
        holder_name: holderName,
        status: status,
        note: note,
        created_at: new Date().toISOString()
      });
    } else {
      // เขียนทับเฉพาะ 6 ช่องที่แก้ได้ คง id และ created_at เดิมไว้
      const asset = assets.find(function (item) {
        return item.id === editingId;
      });
      asset.name = name;
      asset.category = category;
      asset.serial_number = serialNumber;
      asset.holder_name = holderName;
      asset.status = status;
      asset.note = note;
    }

    saveAssets(assets);
    cancelEdit();
    renderTable();
  }

  // ครอบค่าด้วยเครื่องหมายคำพูดเมื่อมีอักขระที่ทำให้โครงสร้าง CSV เพี้ยน
  function toCsvValue(value) {
    const text = value || '';
    if (text.includes(',') || text.includes('"') || text.includes('\n')) {
      return '"' + text.replace(/"/g, '""') + '"';
    }
    return text;
  }

  // ส่งออกเฉพาะรายการที่แสดงอยู่ในตารางตอนนี้เป็นไฟล์ CSV
  function exportCsv() {
    const visibleAssets = getFilteredAssets(loadAssets());

    if (visibleAssets.length === 0) {
      alert('ไม่มีข้อมูลให้ส่งออก');
      return;
    }

    const lines = ['ชื่ออุปกรณ์,ประเภท,หมายเลขเครื่อง,ผู้ถือครอง,สถานะ,หมายเหตุ'];

    visibleAssets.forEach(function (asset) {
      lines.push([
        toCsvValue(asset.name),
        toCsvValue(CATEGORY_LABELS[asset.category]),
        toCsvValue(asset.serial_number),
        toCsvValue(asset.holder_name),
        toCsvValue(STATUS_LABELS[asset.status]),
        toCsvValue(asset.note)
      ].join(','));
    });

    // BOM ข้างหน้าไฟล์ ถ้าไม่ใส่ Excel บน Windows จะอ่านภาษาไทยเป็นตัวขยะ
    const csv = '\uFEFF' + lines.join('\r\n');

    // ใช้เวลาท้องถิ่น ไม่ใช้ toISOString() ที่ให้เวลา UTC แล้วได้วันที่คลาดไปหนึ่งวัน
    const now = new Date();
    const fileDate = now.getFullYear() +
      '-' + String(now.getMonth() + 1).padStart(2, '0') +
      '-' + String(now.getDate()).padStart(2, '0');

    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'it-assets-' + fileDate + '.csv';

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  document.getElementById('asset-form').addEventListener('submit', handleSubmit);
  document.getElementById('search').addEventListener('input', renderTable);
  document.getElementById('filter-category').addEventListener('change', renderTable);
  document.getElementById('filter-status').addEventListener('change', renderTable);
  document.getElementById('cancel-edit').addEventListener('click', cancelEdit);
  document.getElementById('export-csv').addEventListener('click', exportCsv);
  renderTable();
</script>

</body>
</html>
